name: Node.js CI

on: [push, pull_request]

jobs:

  test-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18, 20, 24]

    steps:
    - uses: actions/checkout@v4
    - name: Run parallel tests in Docker (Node.js ${{ matrix.node-version }})
      run: NODE_VERSION=${{ matrix.node-version }} MAX_JOBS=6 npm run test:parallel

  test-bun:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
    - name: Run parallel tests in Docker (Bun)
      run: RUNTIME=bun MAX_JOBS=6 npm run test:parallel

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [18, 20, latest]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - name: Run tests (Node.js ${{ matrix.node-version }})
      shell: bash
      run: bash test/windows.sh

  test-systemd:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm install
    - name: Run pm2 update under a systemd unit (#5000)
      run: bash test/systemd/update-under-unit.sh
